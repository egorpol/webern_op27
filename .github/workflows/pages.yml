# Publishes the viewer (site/), the MEI files and facsimiles/ue1937/pages.json
# to GitHub Pages. scripts/build_site.py copies only those files; the scan is
# never published.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mei/**"
      - "facsimiles/ue1937/pages.json"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
